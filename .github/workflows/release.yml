name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    if: github.actor == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: 验证发布来源
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release 标签必须指向 main 分支历史中的提交。" >&2
              exit 1
          fi

      - name: 运行完整检查
        run: make check

      - name: 构建发布包
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: make package VERSION="${RELEASE_VERSION#v}"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
              dist/*.dmg \
              dist/*.zip \
              dist/*.sha256 \
              --verify-tag \
              --title "CloudPlatter $GITHUB_REF_NAME" \
              --notes-file Config/RELEASE_NOTES.md \
              "${release_flags[@]}"
